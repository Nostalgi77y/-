services:
  mysql:
    extends:
      file: docker-compose.yml
      service: mysql
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq
  minio:
    extends:
      file: docker-compose.yml
      service: minio
  server:
    build: ../cloud-meal-server
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/cloud_meal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USERNAME: cloud_meal
      MYSQL_PASSWORD: cloud_meal_dev
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: cloud_meal
      RABBITMQ_PASSWORD: cloud_meal_dev
      JWT_SECRET: change-this-production-secret-with-at-least-32-characters
      FILE_UPLOAD_DIR: /data/cloud-meal/uploads
      PAYMENT_MODE: ${PAYMENT_MODE:-MOCK}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
    volumes:
      - ./data/uploads:/data/cloud-meal/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_started }
    ports: ["8080:8080"]
  admin:
    build: ../cloud-meal-admin
    depends_on: [server]
    ports: ["80:80"]
