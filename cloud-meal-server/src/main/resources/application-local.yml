spring:
  datasource:
    url: jdbc:h2:mem:cloud_meal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: simple
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  flyway:
    enabled: true

cloud-meal:
  messaging:
    enabled: false

logging:
  level:
    com.cloudmeal: info
    org.springframework.amqp.rabbit.connection: warn

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
