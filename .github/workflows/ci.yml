name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn test
  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud-meal-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: cloud-meal-admin/package-lock.json }
      - run: npm ci
      - run: npm run build
  user:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud-meal-user } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: cloud-meal-user/package-lock.json }
      - run: npm ci
      - run: npm run build:mp-weixin
